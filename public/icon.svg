<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7DFC2" />
      <stop offset="48%" stop-color="#D8693E" />
      <stop offset="100%" stop-color="#9A3B1C" />
    </linearGradient>
    <radialGradient id="medallionGrad" cx="42%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#E77B4B" />
      <stop offset="65%" stop-color="#C8532A" />
      <stop offset="100%" stop-color="#8F3416" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="180" y1="120" x2="360" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE699" />
      <stop offset="55%" stop-color="#F6B94D" />
      <stop offset="100%" stop-color="#CE811E" />
    </linearGradient>
    <linearGradient id="starGrad" x1="220" y1="180" x2="310" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="55%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="calHeader" x1="125" y1="220" x2="250" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="calBody" x1="130" y1="250" x2="255" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#E9DEC5" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#431607" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Central 3D Medallion -->
  <circle cx="256" cy="256" r="172" fill="#F6DAC4" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="154" fill="url(#medallionGrad)" />

  <!-- Scholar Cap Emblem (Bottom Right) -->
  <g filter="url(#dropShadow)" transform="translate(292, 268) rotate(12)">
    <path d="M12 36 L58 14 L104 36 L58 58 Z" fill="#313B68" />
    <path d="M26 45 V68 C26 76 42 84 58 84 C74 84 90 76 90 68 V45" fill="#1E2547" />
    <path d="M58 36 L88 52 V78" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <circle cx="88" cy="80" r="7" fill="#FBBF24" />
  </g>

  <!-- Tilted 3D Mystery Star Card -->
  <g filter="url(#dropShadow)" transform="translate(274, 232) rotate(16) translate(-85, -110)">
    <rect x="0" y="0" width="170" height="220" rx="26" fill="#C27416" transform="translate(4, 8)" />
    <rect x="0" y="0" width="170" height="220" rx="26" fill="url(#cardGrad)" stroke="#FDE68A" stroke-width="6" />
    <!-- 3D Star inside card -->
    <path
      d="M85 52 L101 86 L138 91 L111 117 L118 154 L85 136 L52 154 L59 117 L32 91 L69 86 Z"
      fill="url(#starGrad)"
      stroke="#D97706"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>

  <!-- 3D Attendance Calendar Badge (Bottom Left) -->
  <g filter="url(#dropShadow)" transform="translate(132, 218) rotate(-12)">
    <rect x="0" y="22" width="132" height="128" rx="26" fill="#CFC0A2" transform="translate(4, 8)" />
    <rect x="0" y="22" width="132" height="128" rx="26" fill="url(#calBody)" />
    <path d="M0 48 C0 33.64 11.64 22 26 22 H106 C120.36 22 132 33.64 132 48 V64 H0 V48 Z" fill="url(#calHeader)" />
    <!-- Calendar Rings -->
    <rect x="28" y="6" width="16" height="32" rx="8" fill="#F5E6CA" stroke="#D4B98C" stroke-width="3" />
    <rect x="88" y="6" width="16" height="32" rx="8" fill="#F5E6CA" stroke="#D4B98C" stroke-width="3" />
    <!-- 3D Checkmark -->
    <path
      d="M42 98 L59 115 L92 78"
      stroke="#10B981"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
